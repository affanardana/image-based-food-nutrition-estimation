# Canonical Food Mapping Configuration
# Maps vision model labels (VisionClass) to standardized business entities (CanonicalFood).
#
# Format:
#   canonical_foods:
#     <canonical_id>:
#       name: <human-readable name>
#       typical_weight_g: <typical serving weight in grams>
#       physical_properties:
#         density_g_per_cm3: <density (rho)>
#         calibration_factor: <gamma — empirical height scale factor (Eq 4)>
#       vision_labels:
#         - <vision class label 1>
#         - <vision class label 2>
#
# NOTE: calibration factors and densities are DUMMY values for development
# and testing. They must be calibrated from real data before production use.

canonical_foods:
  sate:
    name: "Sate"
    typical_weight_g: 100.0
    physical_properties:
      density_g_per_cm3: 0.95
      calibration_factor: 15.0
    vision_labels:
      - "sate"
      - "satay"
      - "chicken_satay"
      - "beef_satay"

