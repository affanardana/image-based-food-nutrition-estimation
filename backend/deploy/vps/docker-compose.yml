# Backend API on the VPS.
#
# Run from this directory (`deploy/vps`), after filling in .env:
#     docker compose up -d --build
#
# Both services use host networking, and that is deliberate. The vision
# service arrives through an SSH reverse tunnel bound to this host's
# 127.0.0.1:9099 — and a container on its own bridge network cannot see
# the host's loopback (host.docker.internal resolves to the bridge
# gateway, a different address). Sharing the host's network namespace
# makes 127.0.0.1 mean the same thing on both sides.
#
# The consequence to be aware of: the API binds 127.0.0.1:8000 and Caddy
# binds 0.0.0.0:80/443. Nothing else is published.

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: ifne-api
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    # Bound to loopback explicitly: under host networking, uvicorn's
    # default of 0.0.0.0 would publish the API on the public interface
    # and bypass Caddy entirely.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?set API_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here; losing this volume means re-issuing them,
      # and Let's Encrypt rate-limits repeated issuance.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
